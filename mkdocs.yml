site_name: MVL — Maximum Verifiable Language
site_url: https://mvl-lang.org
site_description: The smallest language where the compiler verifies the most.
site_author: LAB271

repo_url: https://github.com/mvl-lang/mvl-lang.github.io
repo_name: mvl-lang/mvl-lang.github.io

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - header.autohide
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Install: install.md
  - Getting Started: getting-started.md
  - Why MVL:
    - The Principle: why/principle.md
    - The 11 Requirements: why/requirements.md
    - Testing Suite: why/testing.md
    - Build Assurance: why/build-assurance.md
    - Runtime Observability: why/runtime.md
  - Language:
    - Overview: language/overview.md
    - Design Principles: language/principles.md
    - Inspirations: language/inspirations.md
    - Examples: language/examples.md
  - Docs:
    - Language Reference: docs/reference.md
    - Standard Library: docs/stdlib.md
    - Extension Packages: docs/packages.md
    - Assurance Report: docs/assurance.md
    - Bootstrapping: docs/bootstrapping.md
    - Self-Hosted Hello World: docs/self-hosted-hello.md
  - The Lynx: lynx.md
  - Community:
    - Contributing: community/contributing.md
    - Roadmap: community/roadmap.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mvl-lang

copyright: Copyright &copy; 2026 LAB271 — Apache 2.0
